spring.application.name=academia-backend

# Escuta em todas as interfaces para que o celular (APK) consiga acessar pela rede local
server.address=0.0.0.0
server.port=8080

# Banco H2 em arquivo: os dados continuam salvos depois de reiniciar o servidor
spring.datasource.url=jdbc:h2:file:./data/academia;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do banco: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/academia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jackson.serialization.write-dates-as-timestamps=false

# Login: o sistema usa seus próprios usuários (tabela usuarios) e tokens de sessão;
# desliga o usuário "user" com senha aleatória que o Spring Security criaria sozinho.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Desempenho do site: compacta HTML/CSS/JS/JSON (gzip) antes de enviar ao navegador
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# O navegador guarda os arquivos do site, mas confere se mudaram (resposta 304) antes de usar.
# Assim uma atualização do front-end aparece na hora, sem precisar de Ctrl+F5.
spring.web.resources.cache.cachecontrol.no-cache=true
